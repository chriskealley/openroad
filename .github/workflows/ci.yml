name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  pack:
    name: pack and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Pack the tarball
        run: npm pack --pack-destination /tmp
      - name: Install the tarball into a scratch OpenSpec project
        run: |
          mkdir -p /tmp/proj/openspec/specs /tmp/proj/openspec/changes
          printf 'schema: spec-driven\ncontext: |\n  Existing project context\n' > /tmp/proj/openspec/config.yaml
          cp /tmp/proj/openspec/config.yaml /tmp/config.before.yaml
          cd /tmp/proj
          npm init -y
          npm install /tmp/chriskealley-openroad-*.tgz
      - name: Exercise the full lifecycle
        working-directory: /tmp/proj
        run: |
          npx openroad init --tools claude
          npx openroad doctor
          npx openroad update
          npx openroad doctor
          npx openroad remove
      - name: Config must round-trip byte-identical
        working-directory: /tmp/proj
        run: diff /tmp/config.before.yaml openspec/config.yaml
